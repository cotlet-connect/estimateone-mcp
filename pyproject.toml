[project]
name = "estimateone-mcp"
version = "1.0.0"
description = "Connect EstimateOne to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No EstimateOne API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["estimateone", "estimateone api", "estimateone mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/estimateone-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=estimateone"
Source = "https://github.com/cotlet-connect/estimateone-mcp"

[project.scripts]
estimateone-mcp = "estimateone_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"estimateone_agent.py" = "estimateone_agent.py"

[tool.hatch.build.targets.sdist]
include = ["estimateone_agent.py", "README.md", "LICENSE", "mcp.json", "skills", "examples", ".cursor"]
